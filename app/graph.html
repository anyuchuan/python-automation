<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#233c47;background:#fff}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}.shell{border:1px solid #e2e8e9;border-radius:16px;overflow:hidden;background:#fbfdfd}.top{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;background:white;border-bottom:1px solid #e8eeee}.kicker{font-size:12px;letter-spacing:.12em;color:#6c838d}.tools{display:flex;gap:6px}.tools button{border:1px solid #d6e0e3;color:#34515c;border-radius:7px;background:white;padding:5px 10px}.body{display:grid;grid-template-columns:minmax(0,1fr) 290px;height:585px}.canvas{position:relative;overflow:hidden;background-color:#f9fcfb;background-image:radial-gradient(#dfe7e5 .7px,transparent .7px);background-size:16px 16px}svg{width:100%;height:100%;touch-action:none;cursor:grab}svg:active{cursor:grabbing}.node{cursor:pointer;outline:none}.node rect{fill:white;stroke-width:1.4;filter:drop-shadow(0px 2px 2px #173e4610)}.node.selected rect{stroke-width:3}.node:focus rect{stroke-width:3}.node.dim{opacity:.23}.edge{fill:none;stroke-width:1.4;opacity:.65;cursor:pointer}.edge.active{stroke-width:2.5;opacity:1}.edge.dim{opacity:.10}.lane{font-size:13px;fill:#81959c;letter-spacing:.06em}.code{font-family:ui-monospace,monospace;font-size:10px;fill:#788d94}.name{font-size:12px;fill:#28404a}.side{padding:18px;border-left:1px solid #e6ecee;background:white;overflow:auto}.side h2{font-size:17px;font-weight:650;margin:8px 0 16px;line-height:1.5}.side dl{margin:0}.side dt{font-size:11px;color:#8798a0;margin:14px 0 4px}.side dd{margin:0;font-size:12px;color:#405b65;line-height:1.7;overflow-wrap:anywhere;white-space:pre-line}.tag{display:inline-block;background:#eaf5ef;color:#17755e;font-size:10px;border-radius:5px;padding:4px 7px}.related{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.related button{border:1px solid #e2e9eb;border-radius:5px;background:#f9fbfb;color:#3c5962;font:11px ui-monospace,monospace;padding:5px}.foot{padding:11px 17px;border-top:1px solid #e5eceb;display:flex;gap:18px;flex-wrap:wrap;font-size:11px;color:#778e95}.legend{display:flex;align-items:center;gap:6px}.sample{width:24px;border-top:2px solid var(--c)}.muted{color:#91a1a5}.hint{position:absolute;left:15px;bottom:12px;font-size:10px;color:#8ba0a5;pointer-events:none}.empty{font-size:14px;fill:#889ba2}@media(max-width:820px){.body{grid-template-columns:1fr;height:auto}.canvas{height:400px}.side{height:240px;border-left:0;border-top:1px solid #e6ecee}.top{padding:10px}.kicker{font-size:10px}}
</style></head><body><div class="shell"><div class="top"><span class="kicker">LOCAL RELATION MAP · 点击节点查看证据</span><div class="tools"><button id="zoom-out" aria-label="缩小">−</button><button id="zoom-in" aria-label="放大">＋</button><button id="fit">适应画布</button><button id="reset">清除高亮</button></div></div><div class="body"><div class="canvas"><svg id="graph" role="img" aria-label="课程能力局部知识图谱"><g id="plot"></g></svg><span class="hint">滚轮缩放 · 拖动画布 · 点击节点或连线 · Tab / Enter可操作节点</span></div><aside class="side" id="detail" aria-live="polite"></aside></div><div class="foot"><span class="legend"><i class="sample" style="--c:#12806b"></i>直接文本支撑</span><span class="legend"><i class="sample" style="--c:#c68a28;border-top-style:dashed"></i>部分支撑</span><span class="legend"><i class="sample" style="--c:#8b68b0;border-top-style:dashed"></i>研究推断 / 待审核</span><span class="legend"><i class="sample" style="--c:#bb4c62;border-top-style:dotted"></i>高风险 / 隔离（探索）</span><span class="legend"><i class="sample" style="--c:#93a0a9;border-top-style:dotted"></i>未见支撑仅标节点，不造连线</span></div></div>
<script>
'use strict';const DATA=/*__GRAPH_DATA__*/;const svg=document.getElementById('graph'),plot=document.getElementById('plot'),panel=document.getElementById('detail');const NS='http://www.w3.org/2000/svg';const nodes=new Map(DATA.nodes.map(n=>[n.id,n]));let selected=null;const groups=new Map();for(const n of DATA.nodes){if(!groups.has(n.lane))groups.set(n.lane,[]);groups.get(n.lane).push(n);}const lanes=[...groups.keys()].sort((a,b)=>a-b);const width=Math.max(650,lanes.length*196+28),height=Math.max(580,...[...groups.values()].map(v=>v.length*66+110));let view=[0,0,width,height];const base=[...view];function setView(){svg.setAttribute('viewBox',view.join(' '));}setView();const positions=new Map();const captions=['岗位候选','工作任务','职业能力','教学项目 / 目标','知识点','实操要求'];function el(tag,attrs={},text){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e;}for(let i=0;i<lanes.length;i++){const lane=lanes[i],items=groups.get(lane).sort((a,b)=>a.id.localeCompare(b.id));plot.append(el('text',{x:26+i*196,y:30,class:'lane'},captions[lane]));for(let j=0;j<items.length;j++)positions.set(items[j].id,{x:22+i*196,y:62+j*66});}
for(const e of DATA.edges){const a=positions.get(e.from),b=positions.get(e.to);if(!a||!b)continue;const ax=a.x+78,ay=a.y+23,bx=b.x+78,by=b.y+23;const dx=Math.max(40,Math.abs(bx-ax)*.45);const path=el('path',{d:`M ${ax} ${ay} C ${ax+dx} ${ay},${bx-dx} ${by},${bx} ${by}`,stroke:e.color,'stroke-dasharray':e.dash,class:'edge','data-from':e.from,'data-to':e.to});path.append(el('title',{},e.name+'\n'+e.state));path.addEventListener('click',event=>{event.stopPropagation();showEdge(e);});plot.append(path);}
for(const n of DATA.nodes){const p=positions.get(n.id);const g=el('g',{transform:`translate(${p.x},${p.y})`,class:'node','data-id':n.id,tabindex:'0',role:'button','aria-label':n.id+' '+n.name});g.append(el('rect',{width:156,height:48,rx:9,stroke:n.color}));g.append(el('rect',{x:0,y:9,width:3,height:30,rx:1,fill:n.color,stroke:n.color}));g.append(el('text',{x:12,y:16,class:'code'},n.id.length>23?n.id.slice(0,22)+'…':n.id));const label=[...n.name];g.append(el('text',{x:12,y:35,class:'name'},label.length>10?label.slice(0,10).join('')+'…':n.name));g.append(el('title',{},n.name+'\n'+n.info['证据状态']));g.addEventListener('click',event=>{event.stopPropagation();select(n.id);});g.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();select(n.id);}});plot.append(g);}
function element(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}function fields(obj,keys){const dl=element('dl');for(const key of keys){const value=obj[key];if(value===undefined||value===null||value==='')continue;dl.append(element('dt',key));dl.append(element('dd',String(value)));}panel.append(dl);}function select(id){const n=nodes.get(id);if(!n)return;selected=id;const related=new Set([id]);for(const e of DATA.edges)if(e.from===id||e.to===id){related.add(e.from);related.add(e.to);}for(const item of plot.querySelectorAll('.node')){item.classList.toggle('selected',item.dataset.id===id);item.classList.toggle('dim',!related.has(item.dataset.id));}for(const path of plot.querySelectorAll('.edge')){const active=path.dataset.from===id||path.dataset.to===id;path.classList.toggle('active',active);path.classList.toggle('dim',!active);}panel.replaceChildren();panel.append(element('span',n.type,'tag'));panel.append(element('h2',n.name));fields(n.info,['编码','来源','证据类型','课程引用物理页码','审核状态','证据状态','课程支撑等级','课程支撑的具体技术行为','课程尚未明确覆盖的工作行为','课程判断理由']);panel.append(element('dt','相关节点（当前子图）'));const list=element('div',undefined,'related');for(const r of [...related].sort()){if(r===id||!nodes.has(r))continue;const btn=element('button',r);btn.addEventListener('click',()=>select(r));list.append(btn);}panel.append(list);const disclosure=element('details');disclosure.append(element('summary','原始属性'));const pre=element('pre',JSON.stringify(n.info['源属性'],null,2));pre.style.cssText='font-size:10px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7';disclosure.append(pre);panel.append(disclosure);}
function showEdge(e){panel.replaceChildren();panel.append(element('span','关系证据 · 未人工确认','tag'));panel.append(element('h2',e.name));fields({'起点':e.from,'终点':e.to,'状态':e.state,'风险说明':e.risk,'来源':e.source,'原记录ID':e.sourceId,'原文或摘要':e.quote},['起点','终点','状态','风险说明','来源','原记录ID','原文或摘要']);}
function clear(){selected=null;for(const e of plot.querySelectorAll('.node,.edge'))e.classList.remove('dim','active','selected');panel.replaceChildren();panel.append(element('h2','从一个节点开始'));panel.append(element('p','点击节点查看编码、来源、课程页码和关联节点；点击连线查看证据。所有匹配仍保留研究与审核状态。','muted'));}
function zoom(f){const nw=view[2]*f,nh=view[3]*f;view=[view[0]+(view[2]-nw)/2,view[1]+(view[3]-nh)/2,nw,nh];setView();}document.getElementById('zoom-in').onclick=()=>zoom(.8);document.getElementById('zoom-out').onclick=()=>zoom(1.25);document.getElementById('fit').onclick=()=>{view=[...base];setView();};document.getElementById('reset').onclick=clear;svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.12:.89);},{passive:false});let drag=null;svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node')||e.target.closest('.edge'))return;drag={x:e.clientX,y:e.clientY,view:[...view]};svg.setPointerCapture(e.pointerId);});svg.addEventListener('pointermove',e=>{if(!drag)return;const box=svg.getBoundingClientRect();view=[drag.view[0]-(e.clientX-drag.x)*drag.view[2]/box.width,drag.view[1]-(e.clientY-drag.y)*drag.view[3]/box.height,drag.view[2],drag.view[3]];setView();});svg.addEventListener('pointerup',()=>drag=null);if(DATA.nodes.length){select(DATA.center&&nodes.has(DATA.center)?DATA.center:DATA.nodes[0].id);}else{plot.append(el('text',{x:70,y:180,class:'empty'},'当前筛选无节点'));clear();}
</script></body></html>
