<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#24424b;background:transparent}button{font:inherit;cursor:pointer}button:focus-visible,[tabindex]:focus-visible{outline:3px solid #7bc6b5;outline-offset:2px}.surface{border:1px solid #dde8e4;border-radius:12px;background:#fff;overflow:hidden}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid #e5eeea;background:#fafcfb;font-size:12px;color:#6c8588}.tools{display:flex;gap:5px;flex-wrap:wrap}.tools button{border:1px solid #dae5e0;background:white;border-radius:6px;padding:5px 9px;color:#365c60;font-size:11px}.tools button:disabled{opacity:.45;cursor:default}.tree{padding:12px 16px;min-height:390px;max-height:530px;overflow:auto}.branch{margin:0;padding:0;list-style:none}.children{margin-left:18px;border-left:1px solid #dce8e3;padding:4px 0 4px 15px}.row{display:flex;align-items:center;gap:7px;padding:4px 0}.toggle{width:24px;height:28px;flex:0 0 24px;border:0;border-radius:5px;background:#edf4f1;color:#4c756b}.toggle.leaf{background:transparent;color:#98aaa9;cursor:default}.node{display:flex;align-items:center;gap:10px;text-align:left;width:100%;border:1px solid transparent;border-radius:8px;background:transparent;padding:10px 12px;min-height:45px;color:#29464d}.node:hover{background:#f2f7f4}.node.selected{border-color:#73b9a6;background:#eaf5ee}.node .code{font:11px ui-monospace,monospace;color:#66827c;min-width:43px}.node .name{flex:1;line-height:1.5}.node .level{font-size:10px;color:#829794}.level1>.row>.node{background:#f2f7f5;font-size:15px;font-weight:650;border-left:3px solid #1c7c68;margin:3px 0}.level2>.row>.node{font-size:13px;font-weight:600;border-left:3px solid #729da0}.level3>.row>.node{font-size:12px;border-left:3px solid #a3b8cd}.node.selected{border-color:#73b9a6;background:#eaf5ee}.grade{font-size:10px;white-space:nowrap;padding:3px 6px;border-radius:4px;background:#edf3f0;color:#56716c}.legend{padding:11px 16px;font-size:11px;line-height:1.9;color:#79908d;border-top:1px solid #e5eeea;display:flex;gap:14px;flex-wrap:wrap}.legend span{display:inline-flex;gap:5px;align-items:center}.sample{width:20px;border-top:2px solid var(--c)}.canvas{height:480px;background-color:#f9fcfa;background-image:radial-gradient(#dce7df .7px,transparent .7px);background-size:16px 16px;overflow:hidden}svg{width:100%;height:100%;touch-action:none;cursor:grab}.gnode{cursor:pointer;outline:none}.gnode rect{fill:white;stroke-width:1.4}.gnode.selected rect{stroke-width:3}.gnode.dim{opacity:.35}.edge{fill:none;stroke-width:1.5;opacity:.6;cursor:pointer}.edge:hover{stroke-width:3;opacity:1}.lane{font-size:12px;fill:#78918c}.gcode{font:10px ui-monospace,monospace;fill:#759089}.gname{font-size:12px;fill:#29484b}.matrixwrap{overflow:auto;max-height:540px}.matrix{width:100%;border-collapse:separate;border-spacing:0;font-size:11px}.matrix th{position:sticky;top:0;background:#f1f6f3;padding:10px;z-index:2;white-space:nowrap;border-bottom:1px solid #dce8e1}.matrix th:first-child{left:0;z-index:3;min-width:190px;text-align:left}.matrix td:first-child{position:sticky;left:0;z-index:1;background:white;padding:7px 10px;min-width:190px;max-width:240px;line-height:1.6}.matrix td{border-bottom:1px solid #eef3ef;text-align:center;padding:4px}.cell{width:100%;min-width:52px;border:1px solid transparent;border-radius:4px;padding:8px 5px;font-size:11px}.cell.selected{outline:2px solid #254e55;outline-offset:-2px}.direct{background:#dbf0e5;color:#176b52}.partial{background:#fff0d6;color:#9a681e}.none{background:#f0f3f4;color:#87989c}.pending{background:#eee6f6;color:#806098}.empty{padding:45px 20px;color:#859a95;font-size:13px}.status{font-size:11px;color:#728c84}.count{font-size:11px;color:#81968d}@media(max-width:600px){.tree{padding:6px}.children{margin-left:10px;padding-left:8px}.node{gap:6px;padding:8px}.node .level{display:none}.grade{font-size:9px}.bar{align-items:flex-start}.level1>.row>.node{font-size:13px}}
</style></head><body><main id="root"></main><script>
'use strict';let args={},expanded=new Set(),selected=null,graphSelected=null,view=null,base=null,drag=null,lastGraphSignature=null;
const root=document.getElementById('root');
function send(type,extra={}){window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*');}
function emit(action,extra={}){send('streamlit:setComponentValue',{value:{action,nonce:Date.now()+'-'+Math.random(),...extra},dataType:'json'});}
function height(){send('streamlit:setFrameHeight',{height:Math.ceil(document.body.scrollHeight)+4});}
function dom(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function button(text,fn,parent,disabled=false){const b=dom('button',text);b.type='button';b.disabled=disabled;b.onclick=fn;parent.append(b);return b;}
function shell(label){root.replaceChildren();const s=dom('section',undefined,'surface'),bar=dom('div',undefined,'bar'),tools=dom('div',undefined,'tools');bar.append(dom('span',label));bar.append(tools);s.append(bar);root.append(s);return{s,tools};}
function treeRender(){const {s,tools}=shell('能力层级 · 5项一级 / 14项二级 / 34项三级');
 button('展开至二级',()=>{expanded=new Set(args.tree.filter(n=>n.level==='一级').map(n=>n.id));treeRender();emit('expand',{expanded:[...expanded]});},tools);
 button('全部展开',()=>{expanded=new Set(args.tree.filter(n=>n.level!=='三级').map(n=>n.id));treeRender();emit('expand',{expanded:[...expanded]});},tools);
 button('全部折叠',()=>{expanded.clear();treeRender();emit('expand',{expanded:[]});},tools);
 const body=dom('div',undefined,'tree');body.setAttribute('role','tree');body.setAttribute('aria-label','职业能力层级树');s.append(body);
 const items=args.tree,child=new Map();for(const n of items){const k=n.parent||'';if(!child.has(k))child.set(k,[]);child.get(k).push(n);}
 function branch(parent,into){const list=dom('ul',undefined,'branch');if(parent)list.classList.add('children');into.append(list);for(const n of child.get(parent)||[]){const li=dom('li',undefined,'level'+({'一级':1,'二级':2,'三级':3}[n.level]));li.dataset.id=n.id;li.setAttribute('role','treeitem');li.setAttribute('aria-selected',String(selected===n.id));const row=dom('div',undefined,'row');li.append(row);const has=child.has(n.id);if(has){li.setAttribute('aria-expanded',String(expanded.has(n.id)));const b=button(expanded.has(n.id)?'−':'+',()=>{expanded.has(n.id)?expanded.delete(n.id):expanded.add(n.id);treeRender();emit('expand',{expanded:[...expanded]});},row);b.className='toggle';b.setAttribute('aria-label',(expanded.has(n.id)?'折叠':'展开')+n.id);}else row.append(dom('span','·','toggle leaf'));
 const b=button('',()=>{selected=n.id;treeRender();emit('select',{id:n.id,expanded:[...expanded]});},row);b.className='node'+(selected===n.id?' selected':'');b.dataset.id=n.id;b.setAttribute('aria-label',n.id+' '+n.name);b.append(dom('span',n.id,'code'),dom('span',n.name,'name'),dom('span',n.level,'level'));if(n.grade)b.append(dom('span',n.grade,'grade'));list.append(li);if(has&&expanded.has(n.id))branch(n.id,li);}}
 branch('',body);const legend=dom('div',undefined,'legend');legend.textContent='一级：能力领域　 二级：能力组　 三级：可观察工作行为　｜　点击名称查看详情；± 展开/折叠';s.append(legend);
 if(args.locate&&selected){const n=body.querySelector('.node[data-id="'+selected+'"]');if(n)n.scrollIntoView({block:'nearest'});}height();}
const NS='http://www.w3.org/2000/svg';function svgEl(tag,attrs={},text){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e;}
function networkRender(){const {s,tools}=shell('局部关系 · 点击选择 / 滚轮缩放 / 拖动画布');const data=args.graph,nodes=new Map(data.nodes.map(n=>[n.id,n]));const signature=args.center+'|'+data.nodes.map(n=>n.id).join(',')+'|'+data.edges.map(e=>e.id).join(',');const previous=signature===lastGraphSignature&&view?[...view]:null;lastGraphSignature=signature;graphSelected=nodes.has(args.selected_node)?args.selected_node:args.center;
 const canvas=dom('div',undefined,'canvas'),svg=svgEl('svg',{id:'network',role:'img','aria-label':'能力局部关系网络'}),plot=svgEl('g');svg.append(plot);canvas.append(svg);s.append(canvas);
 const groups=new Map();for(const n of data.nodes){if(!groups.has(n.lane))groups.set(n.lane,[]);groups.get(n.lane).push(n);}const lanes=[...groups.keys()].sort((a,b)=>a-b);const width=Math.max(600,lanes.length*193+30),high=Math.max(430,...[...groups.values()].map(g=>g.length*62+90));base=[0,0,width,high];view=previous||[...base];const positions=new Map();
 const labels=['候选岗位','摘要任务','职业能力','教学项目 / 目标','知识点','实践任务'];for(let i=0;i<lanes.length;i++){plot.append(svgEl('text',{x:23+i*193,y:25,class:'lane'},labels[lanes[i]]));const list=groups.get(lanes[i]).sort((a,b)=>a.id.localeCompare(b.id));for(let j=0;j<list.length;j++)positions.set(list[j].id,{x:20+i*193,y:50+j*62});}
 for(const e of data.edges){const a=positions.get(e.from),b=positions.get(e.to);if(!a||!b)continue;const ax=a.x+75,ay=a.y+22,bx=b.x+75,by=b.y+22,d=Math.max(40,Math.abs(bx-ax)*.4);const p=svgEl('path',{class:'edge','data-id':e.id,d:`M${ax} ${ay} C${ax+d} ${ay},${bx-d} ${by},${bx} ${by}`,stroke:e.color,'stroke-dasharray':e.dash});p.append(svgEl('title',{},e.type+' · '+e.from+' → '+e.to));p.addEventListener('click',()=>emit('edge',{id:e.id}));plot.append(p);}
 for(const n of data.nodes){const p=positions.get(n.id),g=svgEl('g',{class:'gnode'+(graphSelected===n.id?' selected':''),'data-id':n.id,transform:`translate(${p.x},${p.y})`,tabindex:0,role:'button','aria-label':n.id+' '+n.name});g.append(svgEl('rect',{width:152,height:45,rx:8,stroke:n.color}));g.append(svgEl('text',{x:10,y:15,class:'gcode'},n.id));g.append(svgEl('text',{x:10,y:34,class:'gname'},[...n.name].length>10?[...n.name].slice(0,10).join('')+'…':n.name));g.append(svgEl('title',{},n.name));function choose(){graphSelected=n.id;for(const item of plot.querySelectorAll('.gnode'))item.classList.toggle('selected',item.dataset.id===n.id);emit('network_select',{id:n.id});}g.addEventListener('click',choose);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose();}});plot.append(g);}
 function setView(){svg.setAttribute('viewBox',view.join(' '));}function zoom(f){const w=view[2]*f,h=view[3]*f;view=[view[0]+(view[2]-w)/2,view[1]+(view[3]-h)/2,w,h];setView();}setView();button('−',()=>zoom(1.25),tools).id='zoom-out';button('+',()=>zoom(.8),tools).id='zoom-in';button('适应画布',()=>{view=[...base];setView();},tools).id='fit';button('展开所选节点',()=>emit('local_expand',{id:graphSelected}),tools,!nodes.has(graphSelected)).id='local-expand';button('定位到能力树',()=>emit('tree_locate',{id:graphSelected}),tools,!nodes.get(graphSelected)?.capability).id='tree-locate';
 svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.12:.89);},{passive:false});svg.addEventListener('pointerdown',e=>{if(e.target.closest('.gnode,.edge'))return;drag={x:e.clientX,y:e.clientY,view:[...view]};svg.setPointerCapture(e.pointerId);});svg.addEventListener('pointermove',e=>{if(!drag)return;const r=svg.getBoundingClientRect();view=[drag.view[0]-(e.clientX-drag.x)*drag.view[2]/r.width,drag.view[1]-(e.clientY-drag.y)*drag.view[3]/r.height,drag.view[2],drag.view[3]];setView();});svg.addEventListener('pointerup',()=>drag=null);
 if(!data.nodes.length)plot.append(svgEl('text',{x:40,y:150,class:'gname'},'当前筛选无节点，请调整类型或证据筛选。'));
 const legend=dom('div',undefined,'legend');for(const[name,color,dash]of [['直接文本支撑','#137c68',false],['部分支撑','#c68a28',true],['研究推断 / 待审核','#8b68b0',true],['高风险 / 隔离（探索）','#bb4c62',true]]){const span=dom('span'),i=dom('i',undefined,'sample');i.style.setProperty('--c',color);if(dash)i.style.borderTopStyle='dashed';span.append(i,document.createTextNode(name));legend.append(span);}legend.append(dom('span','未见支撑：不造正向关系'));s.append(legend);height();}
function matrixRender(){const {s}=shell('34能力 × 8项目 · 单元可点击查看原理由与引文');const wrap=dom('div',undefined,'matrixwrap'),table=dom('table',undefined,'matrix'),head=dom('thead'),tr=dom('tr');tr.append(dom('th','三级能力'));for(const p of args.projects){const h=dom('th',p.id);h.title=p.name;tr.append(h);}head.append(tr);table.append(head);const body=dom('tbody');const cells=new Map(args.cells.map(c=>[c.cap+'|'+c.project,c]));const labels={'直接支撑':['直接','direct'],'部分支撑':['部分','partial'],'未见明确支撑':['未见','none'],'待人工审核':['待审','pending']};for(const n of args.abilities){const row=dom('tr');row.append(dom('td',n.id+' · '+n.name));for(const p of args.projects){const td=dom('td'),c=cells.get(n.id+'|'+p.id);if(c){const[label,cls]=labels[c.grade]||['暂无','none'];const b=button(label,()=>emit('matrix_select',{id:n.id,project:p.id}),td);b.className='cell '+cls+((args.selected_cap===n.id&&args.selected_project===p.id)?' selected':'');b.dataset.cap=n.id;b.dataset.project=p.id;b.setAttribute('aria-label',n.id+' '+p.id+' '+c.grade);b.title=c.reason||'暂无记录';}else td.textContent='暂无';row.append(td);}body.append(row);}table.append(body);wrap.append(table);s.append(wrap);if(!args.abilities.length)s.append(dom('div','当前筛选无能力','empty'));s.append(dom('div','直接 / 部分 / 未见 / 待审是项目单元判断；不是能力整体等级或学生达成结果。','legend'));height();}
window.addEventListener('message',e=>{if(e.source!==window.parent||e.data.type!=='streamlit:render')return;args=e.data.args;expanded=new Set(args.expanded||[]);selected=args.selected_cap;if(args.mode==='tree')treeRender();else if(args.mode==='network')networkRender();else if(args.mode==='matrix')matrixRender();});
send('streamlit:componentReady',{apiVersion:1});height();
</script></body></html>
