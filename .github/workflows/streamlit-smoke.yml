name: Streamlit deployment smoke
on:
  pull_request:
    paths:
      - 'app/**'
      - 'requirements.txt'
      - '.github/workflows/streamlit-smoke.yml'
      - '.streamlit/config.toml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'requirements.txt'
      - '.github/workflows/streamlit-smoke.yml'
      - '.streamlit/config.toml'
jobs:
  python:
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python app/check_deployment.py
      - run: python -m unittest discover -s app/tests -v
