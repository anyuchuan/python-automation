name: Streamlit deployment smoke
on:
  pull_request:
    paths:
      - 'app/**'
      - 'requirements.txt'
      - '.github/workflows/streamlit-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'requirements.txt'
      - '.github/workflows/streamlit-smoke.yml'
jobs:
  python312:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python app/check_deployment.py
      - run: python -m unittest discover -s app/tests -v
